name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      RUN_DIR: ${{ github.workspace }}/../anvil-ci-run
      PYTHONIOENCODING: cp1252   # CLI must stay ASCII-safe on Windows consoles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Demo run (end-to-end offline)
        run: python -m anvil.cli demo "${{ env.RUN_DIR }}"

      - name: Audit ledger
        run: python -m anvil.cli audit "${{ env.RUN_DIR }}"

      - name: Verify channel integrity
        run: python -m anvil.cli verify-logs "${{ env.RUN_DIR }}"

      - name: Second run on same store stays verifiable
        run: |
          python -m anvil.cli demo "${{ env.RUN_DIR }}"
          python -m anvil.cli verify-logs "${{ env.RUN_DIR }}"
